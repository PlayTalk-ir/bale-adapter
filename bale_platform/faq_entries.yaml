# FAQ entries for the customer-facing reply layer (see bale_platform/faq.py).
#
# - Facts here were taken from replies the support team already sent in the
#   last weeks (Bale chats, 29 Shahrivar - 14 Mehr 1405). Do not add prices,
#   dates or policies that are not confirmed by a manager.
# - `patterns` are regexes matched against FOLDED text (Persian ي/ك -> ی/ک,
#   آ/أ/إ -> ا, digits -> ASCII, ZWNJ -> space). Write them with ا (not آ).
# - `risk: safe`   -> static fact, can become auto-send later (not enabled).
#   `risk: review` -> a human must approve the draft.
# - `kind: escalate` -> never answer; hand the chat to a human.
# - `kind: no_reply` -> nothing to answer (thanks / acknowledgement).
# - `audience: customer` only. Teacher-ops chats are out of scope for this layer.

entries:
  - id: thanks
    kind: no_reply
    category: ack
    risk: safe
    full_patterns:
      - '((سلام|درود|بله|اها|خیلی|بسیار|ممنون|مرسی|مرسیی+|سپاس|تشکر|باشه|چشم|اوکی|ok|okay|حتما|دمتون گرم|قربانتون|خواهش میکنم|مشکلی نداره|عزیزم|از شما|ازتون|شما|فراوان|جان|لطفا|که اطلاع دادین|سلامت باشید|عالی)( |$))+'
  - id: human_only
    kind: escalate
    category: dispute
    risk: review
    reason: payment dispute / makeup policy / churn - human only
    patterns:
      - 'جبرانی'
      - '(انصراف|لغو ثبت نام|کنسل)'
      - 'پس (گرفتن|بدید|بدین|بده)'
      - 'برگردون(ید|ین)'
      - 'شکایت'
      - 'ناراضی|راضی نبود|قابل هضم نبود'
      - '(باقی|بقیه|باقیمانده)( مانده)? شهریه'
      - '(دیگه|فعلا|این ترم).{0,15}(نمیاد|نمیخواد|نمیخوان|نمیاین) .{0,6}کلاس'
      - 'کلاس .{0,6}(نمیاد|نمیخواد)'

  - id: join_class_problem
    category: technical
    risk: review
    patterns:
      - 'اسکای ?روم'
      - 'ارتباط.{0,20}برقرار نشد'
      - '(نمی ?تونم|نمی ?شه|نمی ?تونیم|نمیره).{0,25}(وارد|ورود).{0,25}(کلاس|جلسه|سایت)'
      - 'لینک.{0,25}(باز نمیشه|باز نمی ?کنه|نمیاد|کار نمیکنه)'
      - 'لودینگ'
      - 'تاق هنوز'
      - 'سایت باز نمیشه'
    answer: |-
      سلام عزیزم 🌻
      لینک رو کپی کنید و داخل مرورگر کروم باز کنید و یک بار صفحه رو رفرش کنید.
      اگه باز هم خطا داد، لطفاً یه عکس از صفحه‌ی خطا برامون بفرستید تا بررسی کنیم 🌱

  - id: join_class_howto
    category: education
    risk: review
    patterns:
      - '(چطور|چجوری|چگونه).{0,15}(برم|وارد|باشم|بیام|شرکت).{0,15}(سر )?(کلاس|جلسه)'
      - '(کجا|از کجا).{0,15}(وارد|برم).{0,10}کلاس'
      - 'چطور(ی)?.{0,15}(داخل|تو|سر) (کلاس|جلسه)'
    answer: |-
      عزیزم کلاس‌ها داخل سایت جدید ما برگزار میشن: steach.org 🌱
      اگه موقع ورود به سایت یا کلاس به مشکلی خوردید همین‌جا بفرمایید تا راهنمایی‌تون کنیم.

  - id: homework_where
    category: education
    risk: review
    patterns:
      - '(تکلیف|تکالیف|وردوال|ورد وال).{0,30}(نمیاره|نمیاد|کجا|کجاست|چطور|چجوری|نمیبینم|نمیتونم|نمیشه|ارسال نشده|نیست)'
      - '(کجا|چطور|چجوری).{0,30}(تکلیف|تکالیف|وردوال|ورد وال)'
    answer: |-
      سلام عزیزم 🌻
      تو سایت steach.org از قسمت «تکالیف من» وارد «مشاهده‌ی همه‌ی تکالیف» بشید، روی جلسه‌ی مورد نظر بزنید و تکلیف و وردوال همون جلسه رو ببینید.
      اگه باز هم نمایش داده نشد، یه عکس از صفحه برامون بفرستید 🌱

  - id: contact_teacher
    category: education
    risk: safe
    patterns:
      - '(پیام|ارتباط).{0,30}(تیچر|معلم|مدرس)'
      - '(تیچر|معلم|مدرس).{0,30}(پیام بدم|پیام بزارم|ارتباط)'
      - 'ارتباط با (تیچر|معلم|مدرس)'
    answer: |-
      عزیزم از قسمت «پیام‌ها» داخل سایت می‌تونید برای تیچرتون پیام بذارید 🌱

  - id: minecraft_server
    category: technical
    risk: safe
    patterns:
      - 'ادرس سرور'
      - 'ماین ?کرفت'
      - '(وارد|ورود).{0,15}(گیم|سرور)'
      - 'سرور (پلی ?تاک|ما)'
    answer: |-
      آدرس سرور: sv2.tgmc.ir:27078 🎮
      کلاس‌ها دو بخش ۴۵ دقیقه‌ای هستن: ۴۵ دقیقه‌ی اول سر کلاس هستید و بعدش معلم دوم میاد و با هم وارد سرور میشید.
      لازم نیست قبل از شروع کلاس داخل سرور باشید 🌱

  - id: level_test_booking
    category: sales
    risk: safe
    patterns:
      - '(رزرو|وقت|ثبت).{0,20}تعیین سطح'
      - 'تعیین سطح.{0,20}(رزرو|وقت بگیرم|وقت بدم)'
      - '(میخوام|میخواستم).{0,25}تعیین سطح'
    answer: |-
      سلام وقتتون بخیر 🌻
      برای تعیین سطح از سایت steach.org می‌تونید خودتون وقت رزرو کنید.
      اگه موقع رزرو به مشکلی خوردید همین‌جا بفرمایید تا راهنمایی‌تون کنیم 🌱

  - id: price_terms
    category: sales
    risk: review
    patterns:
      - 'قیمت'
      - '(هزینه|شهریه).{0,20}(چنده|چقدره|چقدر|چند)'
      - 'چند (تومن|تومان|میلیون)'
      - 'هزینه و شرایط'
      - '(هزینه|شهریه).{0,20}(کلاس|ترم).{0,15}(چنده|چقدره|چقدر|چند)'
    answer: |-
      سلام عزیزم 🌻
      هزینه‌ی هر ترم ۳٬۹۸۰٬۰۰۰ تومان هست؛ هر ترم یک ماه و نیم و ۱۲ جلسه‌ست.
      کلاس‌ها شنبه‌چهارشنبه یا یکشنبه‌سه‌شنبه برگزار میشن. اگه سطح و ساعت‌های آزاد فرزندتون رو بفرمایید، کلاس مناسب رو براتون اعلام می‌کنیم 🌱

  - id: registration_start
    category: sales
    risk: review
    patterns:
      - 'ثبت ?نام (کنم|بکنم|کنیم)'
      - '(میخوام|میخواستم|میخواهم).{0,25}ثبت ?نام'
    answer: |-
      سلام وقتتون بخیر 🌻
      خوشحال میشیم در کلاس‌های ما باشید. برای شروع از سایت steach.org یک جلسه‌ی تعیین سطح رزرو کنید تا بعدش کلاس مناسب رو براتون مشخص کنیم 🌱

  - id: term_length
    category: sales
    risk: safe
    patterns:
      - 'ترم.{0,15}(چند ماه|چقدر طول|چند جلسه)'
      - 'چند جلسه.{0,15}(ترم|هست)'
    answer: |-
      هر ترم یک ماه و نیم و شامل ۱۲ جلسه‌ست 🌱

  - id: payment_howto
    category: sales
    risk: review
    patterns:
      - 'کارت به کارت'
      - '(چطور|چجوری|کجا).{0,20}(پرداخت|واریز)'
      - 'رسید.{0,20}(کجا|اپلود|ارسال|نمیشه|نمیتونم)'
      - 'اپلود.{0,15}(رسید|نداره|نمیشه)'
    answer: |-
      عزیزم داخل سایت از قسمت «کارت به کارت» اقدام کنید و بعد از واریز، عکس رسید رو همون‌جا آپلود کنید.
      اگه گزینه‌ی آپلود براتون فعال نبود، عکس رسید رو همین‌جا بفرستید تا ما براتون ثبت کنیم 🌱

  - id: buy_class
    category: sales
    risk: safe
    patterns:
      - '(چطور|چجوری|کجا).{0,25}(کلاس.{0,15})?(بخرم|بخریم|خرید کنم)'
      - 'کلاس جدید.{0,20}(بخرم|بخریم|نمیاد|نمیاره)'
      - '(کد|کلاس) ?\d{3}.{0,25}(کجا|نمیاد|نمیاره|نیست)'
      - 'کد.{0,20}کجای? .{0,10}(سایت|وارد)'
    answer: |-
      عزیزم داخل سایت از قسمت «کلاس‌های من» می‌تونید کلاس‌های مناسب رو خریداری کنید.
      اگه کلاس مورد نظر رو ندیدید یک بار صفحه رو رفرش کنید 🌱

  - id: profile_warning
    category: technical
    risk: safe
    patterns:
      - 'پروفایل.{0,30}(کامل|نکردی|نکردید)'
      - 'نوشته قرمز'
    answer: |-
      اون هشدار قرمز بعد از جلسه‌ی تعیین سطح برطرف میشه 🌱

  - id: class_days
    category: sales
    risk: review
    patterns:
      - '(دوشنبه|پنج ?شنبه|جمعه).{0,30}(کلاس|وقت|ساعت)'
      - '(کلاس|وقت|ساعت).{0,30}(دوشنبه|پنج ?شنبه|جمعه)'
      - '(روز ?ها|ساعت ?ها).{0,15}کلاس'
      - 'کلاس.{0,15}(روز ?ها|ساعت ?ها)'
    answer: |-
      سلام عزیزم 🌻
      کلاس‌های ما شنبه‌چهارشنبه یا یکشنبه‌سه‌شنبه برگزار میشن.
      اگه سطح و ساعت‌های آزاد رو بفرمایید، کلاس مناسب رو براتون اعلام می‌کنیم 🌱

  - id: new_term_start
    category: education
    risk: safe
    patterns:
      - 'ترم جدید.{0,20}(کی|چه وقت|شروع)'
      - '(کی|چه زمانی|چه وقت).{0,20}ترم'
      - 'شروع ترم'
    answer: |-
      سلام عزیزم 🌻
      قبل از شروع ترم جدید حتماً بهتون اطلاع‌رسانی می‌کنیم 🌱

  - id: final_exam
    category: education
    risk: review
    patterns:
      - 'فاینال.{0,25}(کی|کجا|چطور|چجوری|ساعت|نوتیف)'
      - '(کی|کجا|چطور|چجوری).{0,25}فاینال'
      - 'ازمون (پایان|نهایی).{0,25}(کی|کجا|چطور|چجوری|ساعت)'
    answer: |-
      برای آزمون وارد سایت بشید (مطمئن بشید داخل اکانت خودتون هستید).
      بالا سمت راست یه زنگوله هست؛ راس ساعت آزمون روش بزنید تا نوتیفیکیشن امتحان براتون بیاد 🌱
