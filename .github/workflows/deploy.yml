name: Test & Deploy bale-adapter (VPS)

# Bale USERBOT adapter (Shape C) for the PlayTalk company Bale account.
# Staging VPS is the only deploy target. Git-pull + systemctl restart.
#
# Bale runs only on the staging VPS (git-pull + systemd, not Docker).
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   - VPS_DEPLOY_KEY: SSH private key for the staging host (no passphrase)
# Variables:
#   - VPS_HOST: staging VPS IPv4 (default 5.42.223.209)
#   - VPS_PORT: SSH port (default 22; staging uses 3939)
#
# The Bale session file is created interactively on the VPS console by
# scripts/login.py — this workflow NEVER handles the OTP or the JWT.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet httpx pyyaml pytest pytest-asyncio python-ulid aiohttp tzdata openpyxl

      - name: Run unit tests
        run: |
          # Pre-stub aiobale on PYTHONPATH so the adapter can be imported
          # without the real (git-only) package being installed in CI.
          export PYTHONPATH="$PWD/tests:$PWD"
          pytest -q tests

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bale-adapter:ci .

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH (git pull + systemctl restart)
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST || '5.42.223.209' }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$VPS_HOST" bash -s <<'REMOTE'
            set -euo pipefail

            # 1) sync the repo to origin (mirror the VPS to source of truth)
            if [ ! -d /opt/bale-adapter ]; then
              git clone https://github.com/PlayTalk-ir/bale-adapter.git /opt/bale-adapter
            fi
            cd /opt/bale-adapter
            git fetch origin master
            git reset --hard origin/master

            # 2) write the systemd unit (idempotent)
            install -m 0644 systemd/bale-platform.service /etc/systemd/system/bale-platform.service
            install -m 0755 scripts/bootstrap.sh /usr/local/bin/bale-adapter-bootstrap.sh
            # Ensure scripts/login.py is also executable (the repo tracks it
            # with +x but a noexec mount can hide that, so re-set it locally).
            chmod 0755 scripts/login.py
            # /opt may be on a noexec mount (some VPS templates do this);
            # install the bootstrap script outside the mount so systemd can
            # exec it directly.
            if mount | grep -E "on /opt\b" | grep -q noexec; then
              echo "WARN: /opt is noexec — bootstrap.sh is at /usr/local/bin/bale-adapter-bootstrap.sh"
            fi

            # 3) write the env file — keep the session dir honest
            umask 077
            {
              echo "BALE_SESSION_PATH=/opt/bale-adapter/.session/session.bale"
              echo "BALE_KB_DIR=/opt/bale-adapter/kb"
              echo "BALE_LOG_FILE=/opt/bale-adapter/logs/userbot.log"
              echo "BALE_STORE_PATH=/opt/bale-adapter/data/support_inbox.sqlite"
              echo "BALE_CONTACTS_PATH=/opt/bale-adapter/data/contacts.sqlite"
              echo "BALE_OBSERVE_ONLY=true"
              echo "BALE_API_ENABLED=true"
              echo "PYTHONPATH=/opt/bale-adapter"
            } > /opt/bale-adapter/.env
            chmod 600 /opt/bale-adapter/.env
            # Secrets (API tokens, phone pepper, panel token) — never overwritten here.
            touch /opt/bale-adapter/.env.secrets
            chmod 600 /opt/bale-adapter/.env.secrets
            if ! grep -q '^BALE_PANEL_TOKEN=' /opt/bale-adapter/.env.secrets 2>/dev/null; then
              echo "BALE_PANEL_TOKEN=$(openssl rand -hex 24)" >> /opt/bale-adapter/.env.secrets
            fi
            if ! grep -q '^BALE_PANEL_PASSWORD=' /opt/bale-adapter/.env.secrets 2>/dev/null; then
              echo "BALE_PANEL_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)" >> /opt/bale-adapter/.env.secrets
            fi
            if ! grep -q '^BALE_PANEL_USER=' /opt/bale-adapter/.env.secrets 2>/dev/null; then
              echo "BALE_PANEL_USER=admin" >> /opt/bale-adapter/.env.secrets
            fi

            install -m 0644 systemd/bale-panel.service /etc/systemd/system/bale-panel.service
            chmod 0755 scripts/panel.py

            # 4) (re)start the service. bootstrap.sh installs aiobale from GitHub.
            #    If no session file exists yet, runner.py will exit(2) and systemd
            #    will keep retrying — operator must run scripts/login.py on the
            #    VPS console to create the session.
            systemctl daemon-reload
            systemctl enable bale-platform.service
            # First bootstrap (venv + pip) can exceed a short start timeout; without
            # a Bale session the runner exits 2 and Restart=always retries. Do not
            # fail the workflow on that expected state.
            systemctl restart bale-platform.service || true
            systemctl enable bale-panel.service
            systemctl restart bale-panel.service || true

            # 5) wait for bootstrap to land
            for i in $(seq 1 30); do
              state=$(systemctl is-active bale-platform.service 2>/dev/null || echo "unknown")
              case "$state" in
                active|failed|inactive)
                  echo "service state after ${i}s: $state"
                  break
                  ;;
              esac
              sleep 1
            done

            journalctl -u bale-platform.service -n 15 --no-pager -o cat | tail -15
          REMOTE
