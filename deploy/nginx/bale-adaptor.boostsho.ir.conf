server {
    listen 80;
    listen [::]:80;
    server_name bale-adaptor.boostsho.ir;

    include snippets/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bale-adaptor.boostsho.ir;

    include snippets/cloudflare-realip.conf;

    ssl_certificate /etc/nginx/ssl/bale-adaptor.boostsho.ir.crt;
    ssl_certificate_key /etc/nginx/ssl/bale-adaptor.boostsho.ir.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 64k;

    # Only Cloudflare may reach the origin (direct IP hits get 403).
    include snippets/cloudflare-allow.conf;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
