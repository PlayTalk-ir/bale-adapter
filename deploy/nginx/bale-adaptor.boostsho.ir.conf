server {
    listen 80;
    listen [::]:80;
    server_name bale-adaptor.boostsho.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bale-adaptor.boostsho.ir;

    ssl_certificate /etc/letsencrypt/live/bale-adaptor.boostsho.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bale-adaptor.boostsho.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 512k;

    location = /healthz {
        include snippets/cloudflare-realip.conf;
        include snippets/bale-proxy.conf;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /readyz {
        include snippets/cloudflare-realip.conf;
        include snippets/bale-proxy.conf;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8787;
    }

    location ^~ /v1/ {
        include snippets/cloudflare-realip.conf;
        include snippets/bale-proxy.conf;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /docs {
        include snippets/cloudflare-realip.conf;
        include snippets/bale-proxy.conf;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /openapi.json {
        include snippets/cloudflare-realip.conf;
        include snippets/bale-proxy.conf;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8787;
    }

    location / {
        include snippets/cloudflare-realip.conf;
        include snippets/bale-proxy.conf;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8090;
    }
}
