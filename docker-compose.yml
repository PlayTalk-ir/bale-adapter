# Bale adapter on the shared Laravel Docker network (no host ports).
# Copy .env.example -> .env and .env.secrets.example -> .env.secrets first.
# See docs/deploy-docker.md

services:
  bale-adapter:
    build: .
    image: bale-adapter:local
    container_name: bale-adapter
    restart: unless-stopped
    env_file:
      - .env
      - .env.secrets
    networks:
      - laravel
    volumes:
      - bale_session:/app/.session
      - bale_data:/app/data
      - bale_kb:/app/kb
      - bale_logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Opt-in. `docker compose up` does not start this. See docs/mcp.md.
  bale-mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: bale-adapter-mcp:local
    container_name: bale-mcp
    restart: unless-stopped
    env_file:
      - .env
      - .env.secrets
    environment:
      BALE_MCP_API_BASE_URL: http://bale-adapter:8787
      BALE_MCP_HTTP_HOST: 127.0.0.1
      BALE_MCP_HTTP_PORT: "8790"
    networks:
      - laravel
    depends_on:
      - bale-adapter
    command: ["python", "-m", "bale_platform.mcp_server", "http"]

networks:
  laravel:
    external: true
    name: ${LARAVEL_DOCKER_NETWORK:?set LARAVEL_DOCKER_NETWORK in .env}

volumes:
  bale_session:
  bale_data:
  bale_kb:
  bale_logs:
